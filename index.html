<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIDEKI GARAGE & LIFE</title><style>body{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;margin:0;background:#f5f6f7;color:#18212b}header{background:#18212b;color:white;padding:22px 5vw;position:relative}header .ver{position:absolute;right:5vw;top:26px;font-size:.9rem;color:#ddd}main{max-width:1050px;margin:auto;padding:28px 5vw}.card{background:white;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #0001}h1{margin:0}.red{color:#c8242f;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}th{background:#202a34;color:#fff}.muted{color:#69727b;font-size:.9rem}</style></head><body><header><h1>HIDEKI GARAGE & LIFE</h1><div class="ver">v8.0</div></header><main><section class="card"><h2>MotoGP 観戦スケジュール</h2><p id="meta" class="muted">読み込み中…</p><table><thead><tr><th>日付</th><th>GP</th><th>セッション</th><th>競技開始（日本時間）</th><th>放送</th></tr></thead><tbody id="rows"></tbody></table></section><section class="card"><p>GitHub自動更新・自動公開対応版。MotoGP/F1の最新データをGitHubへ更新するとGitHub Pagesへ自動反映する構成です。</p></section></main><script>fetch('data/motogp.json?'+Date.now()).then(r=>r.json()).then(d=>{document.querySelector('#meta').textContent='最終更新 '+d.updated+' ｜ '+d.note;document.querySelector('#rows').innerHTML=d.events.map(e=>`<tr><td>${e.date}</td><td>${e.gp}</td><td class="${e.highlight?'red':''}">${e.session}</td><td class="${e.highlight?'red':''}">${e.start_jst||'確認中'}</td><td>${e.broadcast||'確認中'}</td></tr>`).join('')})</script></body></html>
