<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 / MotoGP | HIDEKI GARAGE & LIFE</title><style>body{margin:0;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:#eef1f3;color:#14202b}header{background:#101923;color:#fff;padding:20px 5vw}header a{color:#fff}.wrap{max-width:1150px;margin:auto;padding:26px 4vw}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0}.red{color:#d52936;font-weight:900}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#17232e;color:white}.scroll{overflow:auto}.muted{color:#68747d;font-size:.85rem}</style></head><body><header><a href="index.html">← CONTROL DECK</a><h1>F1 / MotoGP</h1><div>年間開催 + 開催週タイムスケジュール</div></header><main class="wrap"><section class="card"><h2>表示ルール</h2><p>MotoGPはMoto3 / Moto2を除外し、Q1・Q2・スプリント・決勝を管理。F1はFP1〜3を除外し、予選・スプリント・決勝を管理。</p><p><span class="red">スプリントと本決勝の開始時刻を赤表示</span>。放送開始時刻も併記。同一週末開催は年間一覧で識別。</p></section><section class="card"><h2>開催週スケジュール</h2><p id="meta" class="muted">データ読込中…</p><div class="scroll"><table><thead><tr><th>日付</th><th>GP</th><th>セッション</th><th>競技開始</th><th>放送開始</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card"><h2>年間一覧</h2><p>2026年9月〜12月を対象に、MotoGPとF1の開催週を管理。同一週末開催は赤で識別し、日本での放送時刻は開催週に確定情報へ更新します。</p></section></main><script>fetch('data/motogp.json?'+Date.now()).then(r=>r.json()).then(d=>{document.querySelector('#meta').textContent='最終更新 '+d.updated+' ｜ '+d.note;document.querySelector('#rows').innerHTML=d.events.map(e=>`<tr><td>${e.date}</td><td>${e.gp}</td><td class="${e.highlight?'red':''}">${e.session}</td><td class="${e.highlight?'red':''}">${e.start_jst||'確認中'}</td><td>${e.broadcast||'確認中'}</td></tr>`).join('')}).catch(()=>document.querySelector('#meta').textContent='スケジュールデータ確認中')</script></body></html>
