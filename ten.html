<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>テンちゃん | HIDEKI GARAGE & LIFE</title><style>body{margin:0;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:#eef1f3;color:#14202b}header{background:#101923;color:#fff;padding:20px 5vw}header a{color:#fff}.wrap{max-width:1000px;margin:auto;padding:26px 4vw}.card{background:#fff;border-radius:16px;padding:22px;margin:14px 0}.big{font-size:2rem;font-weight:900}.red{color:#d52936;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:#68747d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="index.html">← CONTROL DECK</a><h1>TEN-CHAN / テンちゃん</h1><div>黒柴 · 2023.10.25 生まれ</div></header><main class="wrap"><div class="grid"><section class="card"><div class="muted">BIRTHDAY</div><div class="big">10月25日</div><p id="age"></p></section><section class="card"><div class="muted">COUNTDOWN</div><div id="count" class="big"></div><p>毎年8月25日から誕生日まで自動表示。</p></section></div><section class="card"><h2>週末ケア</h2><p><b>毎週土曜 08:00</b></p><p>散歩を中心に、クンクン活動・室内知育・季節対策を組み合わせる。</p><p><b>今回の低負担知育：</b>タオルにフードを数粒隠す、3分だけのノーズワーク。</p></section><section class="card"><h2>基本スタイル</h2><p>人にも犬にも友好的。普段の散歩ルーティンを中心に、無理なく新しい刺激を少し追加する。</p></section></main><script>const now=new Date(),y=now.getFullYear(),b=new Date(y,9,25),start=new Date(y,7,25),born=2023;document.querySelector('#age').textContent=`${y-born}歳の誕生日：${y}.10.25`;let c=document.querySelector('#count');if(now>=start&&now<b){let d=Math.ceil((b-now)/86400000);c.innerHTML=`<span class="red">誕生日まであと${d}日！</span>`}else if(now.toDateString()===b.toDateString()){c.innerHTML='<span class="red">今日はテンちゃんの誕生日！</span>'}else{c.textContent='誕生日カウントダウン待機中'}</script></body></html>
